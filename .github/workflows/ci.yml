name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: healthcare_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d healthcare_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/healthcare_test?schema=public
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/healthcare_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npm run db:migrate
      - run: npm run db:seed && npm run db:seed
        env:
          SEED_DEMO_DATA: 'true'
          NODE_ENV: test
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
